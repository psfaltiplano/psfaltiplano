<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provador Virtual</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            min-height: 100vh;
        }

        h1 {
            margin-bottom: 20px;
            color: #333;
        }

        .wardrobe-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 400px;
        }

        .slot {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .slot-title {
            font-size: 14px;
            font-weight: bold;
            color: #666;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Estilo dos novos botões de filtro de cor */
        .color-filter {
            display: flex;
            gap: 5px;
            margin-bottom: 12px;
            background: #eee;
            padding: 3px;
            border-radius: 20px;
            width: 100%;
        }

        .filter-btn {
            background: transparent;
            color: #555;
            font-size: 11px;
            padding: 6px 10px;
            border-radius: 15px;
            font-weight: bold;
            flex: 1;
        }

        .filter-btn:hover {
            background: rgba(0,0,0,0.05);
        }

        .filter-btn.active {
            background: #333;
            color: #fff;
        }

        .image-container {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #eee;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #e0e0e0;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-top: 12px;
            gap: 8px;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
            flex: 1;
        }

        button:hover {
            background-color: #0056b3;
        }

        button.btn-random {
            background-color: #28a745;
            flex: 0.5;
        }

        button.btn-random:hover {
            background-color: #218838;
        }

        .global-controls {
            margin-top: 25px;
            width: 100%;
            max-width: 400px;
        }

        .btn-master-random {
            background-color: #6f42c1;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border-radius: 8px;
        }

        .btn-master-random:hover {
            background-color: #593196;
        }
    </style>
</head>
<body>

    <h1>OUTFITS</h1>

    <div class="wardrobe-container">
        <div class="slot" id="slot-top">
            <div class="slot-title">Parte Superior</div>
            <div class="color-filter">
                <button class="filter-btn active" id="filter-top-all" onclick="setFilter('top', 'all')">Ambos</button>
                <button class="filter-btn" id="filter-top-whi" onclick="setFilter('top', 'whi')">Claras</button>
                <button class="filter-btn" id="filter-top-bla" onclick="setFilter('top', 'bla')">Escuras</button>
            </div>
            <div class="image-container">
                <img id="img-top" src="" alt="Nenhuma imagem disponível">
            </div>
            <div class="controls">
                <button onclick="changeImage('top', -1)">◀ Voltar</button>
                <button class="btn-random" onclick="randomImage('top')">🎲</button>
                <button onclick="changeImage('top', 1)">Avançar ▶</button>
            </div>
        </div>

        <div class="slot" id="slot-bottom">
            <div class="slot-title">Parte Inferior</div>
            <div class="color-filter">
                <button class="filter-btn active" id="filter-bottom-all" onclick="setFilter('bottom', 'all')">Ambos</button>
                <button class="filter-btn" id="filter-bottom-whi" onclick="setFilter('bottom', 'whi')">Claras</button>
                <button class="filter-btn" id="filter-bottom-bla" onclick="setFilter('bottom', 'bla')">Escuras</button>
            </div>
            <div class="image-container">
                <img id="img-bottom" src="" alt="Nenhuma imagem disponível">
            </div>
            <div class="controls">
                <button onclick="changeImage('bottom', -1)">◀ Voltar</button>
                <button class="btn-random" onclick="randomImage('bottom')">🎲</button>
                <button onclick="changeImage('bottom', 1)">Avançar ▶</button>
            </div>
        </div>

        <div class="slot" id="slot-shoe">
            <div class="slot-title">Calçado</div>
            <div style="margin-bottom: 12px;"></div> 
            <div class="image-container">
                <img id="img-shoe" src="" alt="Nenhuma imagem disponível">
            </div>
            <div class="controls">
                <button onclick="changeImage('shoe', -1)">◀ Voltar</button>
                <button class="btn-random" onclick="randomImage('shoe')">🎲</button>
                <button onclick="changeImage('shoe', 1)">Avançar ▶</button>
            </div>
        </div>
    </div>

    <div class="global-controls">
        <button class="btn-master-random" onclick="randomAll()">🎲 Combinar Look Aleatório</button>
    </div>

    <script>
        const path = "roupas_fotos/";

        // QUANTIDADE DE FOTOS (Configure aqui a quantidade atual das suas fotos)
        const totalItems = {
            top_whi: 20,  
            top_bla: 30,  
            bot_whi: 15,  
            bot_bla: 16,  
            shoe: 2      
        };

        // Banco de dados separado por cores
        const sourceWardrobe = {
            top: { all: [], whi: [], bla: [] },
            bottom: { all: [], whi: [], bla: [] },
            shoe: { all: [] } // Calçado apenas lista geral
        };

        // Filtro ativo no momento ('all', 'whi' ou 'bla')
        const activeFilter = {
            top: 'all',
            bottom: 'all'
        };

        // Índices de visualização atuais
        const currentIndex = {
            top: 0,
            bottom: 0,
            shoe: 0
        };

        // Gera as listas de arquivos dinamicamente baseado nos números informados
        function generateWardrobe() {
            // Gerando Tops (Camisas)
            for(let i = 1; i <= totalItems.top_whi; i++) sourceWardrobe.top.whi.push(`TOP_WHI_${i}.jpg`);
            for(let i = 1; i <= totalItems.top_bla; i++) sourceWardrobe.top.bla.push(`TOP_BLA_${i}.jpg`);
            sourceWardrobe.top.all = [...sourceWardrobe.top.whi, ...sourceWardrobe.top.bla];

            // Gerando Bottoms (Calças/Shorts)
            for(let i = 1; i <= totalItems.bot_whi; i++) sourceWardrobe.bottom.whi.push(`BOT_WHI_${i}.jpg`);
            for(let i = 1; i <= totalItems.bot_bla; i++) sourceWardrobe.bottom.bla.push(`BOT_BLA_${i}.jpg`);
            sourceWardrobe.bottom.all = [...sourceWardrobe.bottom.whi, ...sourceWardrobe.bottom.bla];

            // Gerando Shoes
            for(let i = 1; i <= totalItems.shoe; i++) sourceWardrobe.shoe.all.push(`SHOE_${i}.jpg`);
        }

        // Retorna a lista correta baseada no filtro selecionado
        function getActiveList(category) {
            if (category === 'shoe') return sourceWardrobe.shoe.all;
            const filter = activeFilter[category];
            return sourceWardrobe.top[filter] ? sourceWardrobe[category][filter] : sourceWardrobe[category].all;
        }

        // Atualiza a imagem na tela
        function updateDisplay(category) {
            const imgElement = document.getElementById(`img-${category}`);
            const list = getActiveList(category);
            const index = currentIndex[category];
            
            if (list && list.length > 0 && list[index]) {
                imgElement.src = path + list[index];
            } else {
                imgElement.src = ""; // Caso o filtro selecionado esteja vazio
            }
        }

        // Altera o filtro ativo (Ambos, Claras, Escuras)
        function setFilter(category, filterValue) {
            activeFilter[category] = filterValue;
            currentIndex[category] = 0; // Reseta para a primeira foto da nova categoria

            // Atualiza o visual dos botões de filtro
            document.querySelectorAll(`#slot-${category} .filter-btn`).forEach(btn => btn.classList.remove('active'));
            document.getElementById(`filter-${category}-${filterValue}`).classList.add('active');

            updateDisplay(category);
        }

        // Avança ou volta na lista ativa
        function changeImage(category, direction) {
            const list = getActiveList(category);
            if (!list || list.length === 0) return;

            currentIndex[category] += direction;

            if (currentIndex[category] < 0) {
                currentIndex[category] = list.length - 1;
            } else if (currentIndex[category] >= list.length) {
                currentIndex[category] = 0;
            }

            updateDisplay(category);
        }

        // Randomiza apenas a categoria respeitando o filtro ativo
        function randomImage(category) {
            const list = getActiveList(category);
            if (!list || list.length === 0) return;

            const randomIndex = Math.floor(Math.random() * list.length);
            currentIndex[category] = randomIndex;
            updateDisplay(category);
        }

        // Randomiza tudo respeitando os filtros atuais de cada seção
        function randomAll() {
            randomImage('top');
            randomImage('bottom');
            randomImage('shoe');
        }

        window.onload = function() {
            generateWardrobe();
            updateDisplay('top');
            updateDisplay('bottom');
            updateDisplay('shoe');
        };
    </script>
</body>
</html>
