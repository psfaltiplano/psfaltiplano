<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas A4</title>
    <style>
        /* Configuração de página A4 nativa */
        @page {
            size: A4 portrait;
            margin: 0;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        html, body {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            padding: 0;
            background-color: #ffffff;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #000000;
            -webkit-print-color-adjust: exact;
            print-color-adjust: exact;
        }

        /* Painel de Controles (Escondido na Impressão) */
        .controls { 
            background: #f4f7f6;
            padding: 15px;
            border-bottom: 2px solid #ccc;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            justify-content: center;
            flex-wrap: wrap;
        }

        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
        }

        label { 
            font-size: 0.8rem; 
            font-weight: bold; 
            color: #444; 
        }

        input, select { 
            padding: 6px 10px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            font-size: 14px;
        }

        .btn-update { 
            padding: 8px 16px; 
            cursor: pointer; 
            border: none; 
            border-radius: 4px; 
            font-weight: bold; 
            background: #27ae60; 
            color: white; 
            font-size: 14px;
        }

        .btn-update:hover { 
            background: #219150; 
        }

        /* Container da Folha A4 com Margem de Segurança */
        .a4-page {
            width: 210mm;
            height: 297mm;
            margin: 0 auto;
            padding: 5mm; /* Margem de segurança contra cortes de impressão */
            display: flex;
            flex-direction: column;
        }

        /* Grid ajustado dinamicamente para a área segura */
        #table-container {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(10, 1fr);
            border: 1px solid #000;
        }

        .cell {
            border: 1px solid #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding: 2px;
            background: #ffffff;
            overflow: hidden;
        }

        /* Estilo para Prioridade */
        .cell.priority { 
            background-color: #fcfcfc; 
        }

        .cell.priority .number { 
            color: #d32f2f; 
        }

        .cell.priority::after {
            content: "PRIORIDADE";
            position: absolute;
            top: 2px;
            font-size: 6pt;
            font-weight: bold;
            border: 1px solid #d32f2f;
            padding: 0px 3px;
            color: #d32f2f;
            border-radius: 2px;
        }

        .number { 
            font-size: 24pt; 
            font-weight: 800; 
            line-height: 1; 
        }

        .label { 
            font-size: 8pt; 
            font-weight: 700; 
            margin-top: 2px; 
            text-transform: uppercase; 
            color: #222; 
        }

        /* Regras estritas de Impressão */
        @media print {
            .controls { 
                display: none !important; 
            }

            html, body, .a4-page {
                width: 210mm;
                height: 297mm;
            }
        }
    </style>
</head>
<body>

    <div class="controls">
        <div class="input-group">
            <label>Tipo de Senha:</label>
            <select id="typeMode">
                <option value="normal">Normal (01...)</option>
                <option value="priority">Prioridade (P-01...)</option>
            </select>
        </div>
        <div class="input-group">
            <label>Nº Inicial:</label>
            <input type="number" id="startNum" value="1" style="width: 70px;">
        </div>
        <div class="input-group">
            <label>Texto:</label>
            <input type="text" id="textLabel" value="Atendimento">
        </div>
        <button class="btn-update" onclick="generateGrid()">Atualizar Tabela</button>
    </div>

    <div class="a4-page">
        <div id="table-container"></div>
    </div>

    <script>
        function generateGrid() {
            const startNum = parseInt(document.getElementById('startNum').value) || 1;
            const labelText = document.getElementById('textLabel').value;
            const typeMode = document.getElementById('typeMode').value;
            const table = document.getElementById('table-container');
            
            table.innerHTML = ''; 

            for (let i = 0; i < 50; i++) {
                const numVal = (startNum + i).toString().padStart(2, '0');
                const isPriority = typeMode === 'priority';
                
                const cell = document.createElement('div');
                cell.className = `cell ${isPriority ? 'priority' : ''}`;
                
                const finalNum = isPriority ? `P-${numVal}` : numVal;

                cell.innerHTML = `
                    <div class="number">${finalNum}</div>
                    <div class="label">${labelText}</div>
                `;
                table.appendChild(cell);
            }
        }

        generateGrid();
    </script>
</body>
</html>
